# THE MORNING COFFEE — PERSONAL SETTINGS
# Edit this file in GitHub. Changes take effect the next time you run
# "Publish Morning Coffee" (automatically each morning or manually in Actions).
# There is no need to edit Python for these options.
# Do not put passwords, API keys, or private information here: this repo is public.

# Target listening time, in minutes (whole number from 5 to 10).
duration_minutes: 10

# How the briefing should sound and how much explanation it should contain.
presentation_style: "Friendly, natural and conversational British radio presenter talking to one person. Clear, engaging and occasionally witty, without banter, hype or dramatic editorialising."
explanation_depth: "Prioritise breadth: summarise each reported story with key verified facts, adding background only for the most consequential or difficult stories. Define unfamiliar concepts succinctly for a technically capable listener."

# The voice name and spoken delivery instructions for OpenAI text-to-speech.
# 'cedar' matches the existing recording. Unsupported voice names will fail
# at generation, so keep this value unless you have tested an alternative.
voice: cedar
voice_direction: "Warm, personable, natural British conversational delivery, as if talking to one attentive listener; moderate pace and clear pauses; never theatrical or overexcited."

# Turn sections on/off without changing the code.
# Optional topics are off by default; set them to true to add their news feeds.
topics:
  edinburgh_weather: true
  uk_news: true
  scotland_news: true
  world_news: true
  ai_and_data_science: true
  cybersecurity: true
  technical_concept_of_the_day: true
  business_and_economics: false
  science_and_space: true

# Control story count. The script adapts to the chosen overall duration.
headline_stories: 6
cybersecurity_stories: 2

# This is the most powerful customisation option. Write instructions in
# plain English; the generator will incorporate them into the editorial brief.
editorial_instructions: >-
  Plan approximately eight distinct substantive stories in total: six
  general-interest and two cybersecurity, when supported by full articles.
  Prefer UK-wide developments over purely international ones, while keeping
  important Scottish, global and scientific news in the mix. Make AI and
  data science a prominent recurring thread, ideally two strong stories
  when the evidence warrants it; never invent or pad weak stories.
  Preserve 2-4 concrete verified facts per story and working links to
  the underlying reporting. For most stories give a crisp summary and
  specific consequence in about 90-130 spoken words. Reserve an extra
  sentence or two of background for truly important or complicated stories,
  not every item. Use a coherent narrative and brief natural transitions.
  Keep the delivery friendly and conversational, not a formal essay.
  Include a useful cyber/AI technical concept only when tied to actual
  reporting, and explain it from first principles in no more than one
  minute, within the ten-minute total. No generic warnings or padded
  conclusions. Never sacrifice accuracy or Edinburgh's mandatory
  practical weather forecast to meet the word count.

# Optional: add RSS feeds for interests not covered above.
# A valid entry looks like:
# extra_rss_feeds:
#   - name: My specialist news
#     url: https://example.org/news/rss.xml
# All added feeds must be HTTPS. Adding a feed does not guarantee it has
# fresh stories every day. The system shortlists leads and retrieves readable public article text.
extra_rss_feeds: []
