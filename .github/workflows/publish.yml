name: Publish Morning Coffee
on:
  workflow_dispatch:
  # Independent publishing trigger, separate from GitHub's cron scheduler.
  # Workflow source changes are validated independently, not paid news runs.
  push:
    paths:
      - '.github/morning-coffee-trigger.txt'
  schedule:
    # Early UK-local slots support the 07:00 publishing target.
    # The 05:45 ChatGPT watchdog is an independent trigger; GitHub cron
    # provides extra chances if a scheduled or push run is dropped.
    # Later jobs check the live edition and skip duplicate OpenAI calls.
    - cron: '52 5 * * *'
      timezone: 'Europe/London'
    - cron: '12,32,52 6 * * *'
      timezone: 'Europe/London'
    - cron: '12 7 * * *'
      timezone: 'Europe/London'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morning-coffee-pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Check if today's edition is already published
        id: freshness
        env:
          REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/London")).date().isoformat()
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          # Manual dispatch or an explicitly labelled push can force a
          # corrected edition; ordinary schedule and watchdog pushes remain
          # idempotent, to avoid unnecessary repeat OpenAI charges.
          force = event == "push" and "FORCE_REPUBLISH_MORNING_COFFEE" in os.environ.get("REQUEST_MESSAGE", "")
          publish = event == "workflow_dispatch" or force
          if publish:
              print("Explicit regeneration requested (manual dispatch or force-republish).")
          else:
              url = (
                  "https://dhannaway.github.io/morning-coffee/latest.json"
                  + "?check=" + str(int(datetime.now(timezone.utc).timestamp()))
              )
              try:
                  req = Request(url, headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "MorningCoffee/1.0",
                  })
                  with urlopen(req, timeout=15) as response:
                      published = json.load(response)
                  existing_date = published.get("date")
                  publish = existing_date != today
                  print(f"Current published date: {existing_date!r}; UK today: {today}.")
              except Exception as exc:
                  # A stale/absent page should not prevent publication.
                  publish = True
                  print(f"Unable to verify existing edition ({type(exc).__name__}: {exc}). Generating.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if publish else 'false'}\n")
          print("Generate and deploy: " + ("yes" if publish else "no, already current"))
          PY
      - name: Already published today — no paid generation needed
        if: steps.freshness.outputs.publish == 'false'
        run: echo "Today's edition is live; skipping OpenAI calls and Pages deployment."
      - uses: actions/checkout@v4
        if: steps.freshness.outputs.publish == 'true'
      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.freshness.outputs.publish == 'true'
        run: pip install -r requirements.txt
      - name: Check FFmpeg (install only if missing)
        if: steps.freshness.outputs.publish == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate narrated briefing
        if: steps.freshness.outputs.publish == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: gpt-5.4-mini
          OPENAI_SCRIPT_MODEL: gpt-5.4
          OPENAI_TTS_MODEL: gpt-4o-mini-tts
          OPENAI_TTS_VOICE: cedar
        run: python generate.py
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.freshness.outputs.publish == 'true'
        with:
          path: public
      # GitHub sometimes reports no Pages artifact immediately after an
      # upload succeeds: give its artifact API time to become consistent.
      - name: Wait for uploaded Pages artifact to be indexed
        if: steps.freshness.outputs.publish == 'true'
        run: sleep 45
      - name: Publish site (attempt 1)
        if: steps.freshness.outputs.publish == 'true'
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before deployment retry
        if: steps.freshness.outputs.publish == 'true' && steps.deploy1.outcome != 'success'
        run: sleep 45
      - name: Publish site (attempt 2)
        if: steps.freshness.outputs.publish == 'true' && steps.deploy1.outcome != 'success'
        id: deploy2
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final deployment retry
        if: steps.freshness.outputs.publish == 'true' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 60
      - name: Publish site (attempt 3)
        if: steps.freshness.outputs.publish == 'true' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        id: deploy3
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Fail if no Pages deployment succeeded
        if: steps.freshness.outputs.publish == 'true' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        run: exit 1
      - name: Verify today's edition is live
        if: steps.freshness.outputs.publish == 'true' && (steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success')
        run: |
          python3 - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          today = datetime.now(ZoneInfo("Europe/London")).date().isoformat()
          for attempt in range(12):
              url = "https://dhannaway.github.io/morning-coffee/latest.json?verify=" + str(time.time_ns())
              try:
                  with urlopen(Request(url, headers={"Cache-Control":"no-cache"}), timeout=15) as resp:
                      live = json.load(resp)
                  if live.get("date") == today:
                      print("Verified live Morning Coffee edition:", today)
                      break
                  print("Still showing", live.get("date"), "on attempt", attempt + 1)
              except Exception as exc:
                  print("Verification attempt failed:", type(exc).__name__, str(exc))
              time.sleep(10)
          else:
              raise SystemExit("Deployment did not produce a verified current edition")
          PY
