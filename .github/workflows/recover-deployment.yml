name: Recover Morning Coffee Deployment
on:
  # If the publisher fails after making an artifact, recover it automatically.
  workflow_run:
    workflows: ['Publish Morning Coffee']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Failed publishing workflow run containing a successful github-pages artifact'
        required: true
        type: string
  # An independent watchdog can request recovery without regenerating audio.
  push:
    paths:
      - '.github/morning-coffee-recovery.txt'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: morning-coffee-pages
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine source run ID
        id: source
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          run_id = os.environ.get("FAILED_RUN_ID", "").strip() or os.environ.get("REQUESTED_RUN_ID", "").strip()
          if not run_id:
              marker = Path(".github/morning-coffee-recovery.txt").read_text()
              match = re.search(r"^source_run_id:\s*(\d+)\s*$", marker, re.M)
              if not match:
                  raise SystemExit("Recovery marker is missing source_run_id")
              run_id = match.group(1)
          if not re.fullmatch(r"\d+", run_id):
              raise SystemExit("Invalid source run ID")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("run_id=" + run_id + "\n")
          print("Recovering workflow artifact from run", run_id)
          PY
      - name: Retrieve already-generated Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: recovered-artifact
      - name: Rebuild deployment directory without OpenAI calls
        run: |
          mkdir -p public
          tar -xf recovered-artifact/artifact.tar -C public
          test -s public/latest.mp3
          test -s public/latest.json
          python3 -c 'import json; from datetime import datetime; from zoneinfo import ZoneInfo; p=json.load(open("public/latest.json")); today=datetime.now(ZoneInfo("Europe/London")).date().isoformat(); print("Recovering edition:",p.get("date"),"-",p.get("word_count"),"words"); assert p.get("date")==today, "Cannot recover an edition from a different day"'
      - name: Apply newest web player to recovered recording
        run: git show HEAD:public/index.html > public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Allow GitHub artifact API to index uploaded artifact
        run: sleep 40
      - name: Deploy recovered recording (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry
        if: steps.deploy1.outcome != 'success'
        run: sleep 45
      - name: Deploy recovered recording (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome != 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before final retry
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 60
      - name: Deploy recovered recording (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Fail if all deployment attempts failed
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        run: exit 1
