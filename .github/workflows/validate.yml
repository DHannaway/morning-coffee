name: Validate Morning Coffee
on:
  workflow_dispatch:
  push:
    paths:
      - 'generate.py'
      - 'article_research.py'
      - 'briefing_settings.yaml'
      - 'public/index.html'
      - '.github/workflows/publish.yml'
      - '.github/workflows/recover-deployment.yml'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile generate.py article_research.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test guaranteed weather narration
        run: |
          python - <<'PY'
          from generate import weather_opening
          example = {
              "daily": {
                  "temperature_2m_min": 2,
                  "temperature_2m_max": 8,
                  "precipitation_probability_max": 70,
                  "wind_speed_10m_max": 30,
              },
              "hourly": [{"time": "2026-11-24T12:00", "rain_probability_pct": 70}],
          }
          spoken = weather_opening(example)
          assert "Edinburgh" in spoken
          assert "2 to 8 degrees Celsius" in spoken
          assert "70 percent" in spoken
          assert "30 kilometres per hour" in spoken
          assert "12:00" in spoken
          assert "unavailable" in weather_opening(None)
          assert "waterproof" in spoken.lower()
          assert "Practical takeaway" in spoken
          from generate import load_settings
          settings=load_settings()
          assert settings["duration_minutes"] == 10
          assert settings["headline_stories"] == 6
          assert settings["cybersecurity_stories"] == 2
          assert settings["topics"]["edinburgh_weather"]
          print("Weather, practical advice, eight-story targets and ten-minute limit validated.")
          PY
      - name: Check website UI and JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("public/index.html").read_text()
          for required in ('id="status"','id="refresh"','id="edition-kind"',
                           '07:00 UK time', 'Today\'s briefing is overdue',
                           'Check for today\'s edition'):
              assert required in html, f"Missing UI text: {required}"
          script=re.search(r"<script>(.*?)</script>",html,re.S)
          assert script, "Inline website JavaScript missing"
          Path("/tmp/morning-coffee-player.js").write_text(script.group(1))
          PY
          node --check /tmp/morning-coffee-player.js
      - name: Validate briefing settings without OpenAI calls
        run: python generate.py --check-settings
